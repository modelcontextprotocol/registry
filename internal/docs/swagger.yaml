host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: A community driven registry service for Model Context Protocol (MCP)
    servers.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: MCP Registry API
  version: "1.0"
paths:
  /health:
    get:
      description: Check the health status of the API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api_handlers_v0.HealthResponse'
        "500":
          description: Failed to encode response
          schema:
            type: string
      summary: Health check
      tags:
      - health
  /publish:
    post:
      consumes:
      - application/json
      description: Publish a new MCP server to the registry or update an existing
        one
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Server details
        in: body
        name: server
        required: true
        schema:
          $ref: '#/definitions/github_com_modelcontextprotocol_registry_internal_model.PublishRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_modelcontextprotocol_registry_internal_model.Server'
        "400":
          description: Invalid request payload
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Failed to publish server
          schema:
            type: string
      security:
      - Bearer: []
      summary: Publish MCP server
      tags:
      - publish
  /servers:
    get:
      consumes:
      - application/json
      description: Get a paginated list of MCP servers from the registry
      parameters:
      - description: Pagination cursor (UUID)
        in: query
        name: cursor
        type: string
      - description: 'Number of items per page (default: 30)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api_handlers_v0.PaginatedResponse'
        "400":
          description: Invalid cursor parameter
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Failed to get registry list
          schema:
            type: string
      summary: List MCP servers
      tags:
      - servers
  /servers/{id}:
    get:
      consumes:
      - application/json
      description: Get detailed information about a specific MCP server
      parameters:
      - description: Server ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_modelcontextprotocol_registry_internal_model.Server'
        "400":
          description: Invalid server ID format
          schema:
            type: string
        "404":
          description: Server not found
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Failed to get server details
          schema:
            type: string
      summary: Get MCP server details
      tags:
      - servers
securityDefinitions:
  Bearer:
    description: Type "Bearer" followed by a space and GitHub token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
