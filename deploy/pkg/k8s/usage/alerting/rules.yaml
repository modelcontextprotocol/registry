# The usage collector's alert rules, in the format Grafana exports.
# They are provisioned only where mcp-registry:usageCollector is "true" and
# alerting is configured, and are evaluated once an hour. The first two read
# the collector's database through the read-only "Registry usage" data source;
# the third reads VictoriaMetrics.
#
# Grafana expands environment variables in this file, so nothing here, comments
# included, may contain a dollar sign.
# retired.yaml must list every uid in this file: it is how the rules are
# deleted when the collector is retired.
apiVersion: 1
groups:
    - orgId: 1
      name: registry_usage
      folder: application alerts
      interval: 1h
      rules:
        # A stored day starts at 00:00 UTC and the collector runs at 01:15 UTC.
        # While yesterday is stored there is always a day that started less
        # than 52 hours ago; if it is not, there is none from 04:00 UTC on.
        # The first run fills its 13 days oldest first and takes about an hour,
        # so the rule waits two hours before it notifies. Grafana applies the
        # same wait to a query error; the rule below reports one at once.
        - uid: registry-usage-missed-day
          title: Usage collection missed a day
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: registry-usage-pg
              model:
                editorMode: code
                format: table
                intervalMs: 1000
                maxDataPoints: 43200
                rawQuery: true
                rawSql: SELECT count(*) AS recent_days FROM usage_daily WHERE day >= now() - interval '52 hours'
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 2h
          annotations:
            summary: Yesterday's registry usage was not stored by 04:00 UTC
            description: The daily usage collector did not store the last full UTC day. The next run collects every missing day of the last 13, so a single miss heals itself; days older than that are lost. See "Usage collector" in deploy/README.md.
          isPaused: false
          notification_settings:
            receiver: Registry Dev
            repeat_interval: 24h
        # The collector notes a day as approximate at the same 10 percent.
        # The two estimates are judged separately, each only when it can be.
        # Requests: when the gateway counted at least 1,000 that day. The
        # threshold is on the gateway's count, not on the records read, so a
        # busy day whose access records went missing is still reported.
        # Data: when at least 1,000 listing records were sampled. Each listing
        # record stands for up to listing_weight_max requests, so dividing the
        # day's listing requests by that weight never overstates how many
        # there were. With fewer, a handful of records stand for all listing
        # data and the estimate strays beyond 10 percent by chance.
        - uid: registry-usage-drift
          title: Usage estimate drifted from the gateway counters
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: registry-usage-pg
              model:
                editorMode: code
                format: table
                intervalMs: 1000
                maxDataPoints: 43200
                rawQuery: true
                rawSql: SELECT coalesce((SELECT 100 * greatest(CASE WHEN requests >= 1000 THEN abs(log_requests_ratio - 1) END, CASE WHEN listing_weight_max > 0 AND listing_requests / listing_weight_max >= 1000 THEN abs(log_data_ratio - 1) END) FROM usage_daily ORDER BY day DESC LIMIT 1), 0) AS drift_percent
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 10
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 0s
          annotations:
            summary: The newest day's log-based estimate is more than 10 percent from the gateway counters
            description: Requests or data sent, estimated from the sampled access records, no longer match the gateway's counters for the newest stored day. The access record format or the log sampling rule has probably changed; that day's shares are approximate. Requests are judged when the gateway counted at least 1,000, data when at least 1,000 listing records were sampled. See "Usage collector" in deploy/README.md.
          isPaused: false
          notification_settings:
            receiver: Registry Dev
            repeat_interval: 24h
        # The history backup runs at 03:30 UTC and, once its snapshot has been
        # stored and checked in full, records the time in VictoriaMetrics. This
        # is the number of hours since then. No record in seven days counts as
        # 9999 hours, so a backup that has never reported, or has stopped
        # altogether, fires too. A missed night passes 26 hours at 05:30 UTC;
        # the rule then waits an hour, which also leaves time to run the first
        # backup by hand after the rule is first provisioned.
        - uid: registry-usage-backup-missed
          title: Usage history backup missed
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: P4169E866C3094E38
              model:
                editorMode: code
                expr: (time() - max(last_over_time(registry_usage_backup_last_success_timestamp_seconds[7d]))) / 3600 or vector(9999)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 26
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1h
          annotations:
            summary: No backup of the usage history has succeeded for more than 26 hours
            description: The nightly backup of the usage history did not finish, or finished and could not record it. Look at the pg-dump and restic logs of the newest registry-usage-history-backup job in the monitoring namespace; REGISTRY_USAGE_BACKUP_SUCCESS without a record means only the report to VictoriaMetrics failed. Until a backup succeeds, the history depends on a single disk. See "Usage collector" in deploy/README.md.
          isPaused: false
          notification_settings:
            receiver: Registry Dev
            repeat_interval: 24h
