version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    groups:
      go-dependencies:
        patterns:
          - "*"
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /deploy
    groups:
      deploy-go-dependencies:
        patterns:
          - "*"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
