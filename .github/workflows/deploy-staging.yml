name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview the selected ref or deploy staging on main
        type: choice
        options: [preview, apply]
        default: preview
  push:
    branches:
      - main
    paths-ignore:
      - 'deploy/Pulumi.gcpProd.yaml'

permissions:
  contents: read

env:
  PULUMI_VERSION: "3.188.0"

jobs:
  ko-push:
    if: github.event_name == 'push'
    name: Build and Push Image with ko
    outputs:
      image: ${{ steps.build.outputs.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 'stable'
          cache: true

      - name: Set up ko
        uses: ko-build/setup-ko@v0.10

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get build timestamp and tags
        id: build-info
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push with ko
        id: build
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
          VERSION: main-${{ steps.build-info.outputs.date }}-${{ steps.build-info.outputs.short_sha }}
          GIT_COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ steps.build-info.outputs.timestamp }}
        run: |
          # Deploy this build digest even if another push moves the main tag.
          ko build ./cmd/registry \
            --bare \
            --platform=linux/amd64,linux/arm64 \
            --tags=main-${{ steps.build-info.outputs.date }}-${{ steps.build-info.outputs.short_sha }},main > "$RUNNER_TEMP/registry-image.txt"
          image="$(cat "$RUNNER_TEMP/registry-image.txt")"
          python3 deploy/scripts/staging_image.py "$image" > "$RUNNER_TEMP/registry-image-validated.txt"
          echo "image=$(cat "$RUNNER_TEMP/registry-image-validated.txt")" >> "$GITHUB_OUTPUT"

  deploy-staging:
    if: ${{ !cancelled() && (needs.ko-push.result == 'success' || github.event_name == 'workflow_dispatch') }}
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    needs: ko-push
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: deploy/go.sum

      - name: Setup Pulumi
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7
        with:
          pulumi-version: ${{ env.PULUMI_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_STAGING_SERVICE_ACCOUNT_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: mcp-registry-staging
          install_components: gke-gcloud-auth-plugin

      - name: Deploy to Staging
        working-directory: ./deploy
        env:
          PULUMI_STAGING_PASSPHRASE: ${{ secrets.PULUMI_STAGING_PASSPHRASE }}
          REGISTRY_STAGING_IMAGE: ${{ needs.ko-push.outputs.image }}
          DEPLOY_OPERATION: ${{ inputs.operation }}
          # Use the same service account imported by setup-gcloud, avoiding the
          # config-helper file-override loader's missing private_key_id error.
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ""
        run: |
          umask 077
          gcloud auth print-access-token > /dev/null
          gke-gcloud-auth-plugin > /dev/null
          printf '%s' "$PULUMI_STAGING_PASSPHRASE" > passphrase.staging.txt
          trap 'rm -f passphrase.staging.txt' EXIT
          export PULUMI_CONFIG_PASSPHRASE_FILE=passphrase.staging.txt
          if [ -z "$REGISTRY_STAGING_IMAGE" ]; then
            REGISTRY_STAGING_IMAGE="$(python3 scripts/staging_image.py)"
            export REGISTRY_STAGING_IMAGE
          fi
          mode="${DEPLOY_OPERATION:-apply}"
          if [ "$mode" = "apply" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Staging apply requires main."
              exit 1
            fi
            make staging-up
          else
            make staging-preview
          fi
