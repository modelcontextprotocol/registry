name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview main, or retry a failed apply on main
        type: choice
        options: [preview, apply]
        default: preview
  push:
    branches:
      - main
    paths:
      - 'deploy/Pulumi.gcpProd.yaml'

permissions:
  contents: read

env:
  PULUMI_VERSION: "3.188.0"

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: |
            deploy/go.sum
            .github/workflows/deploy-production.yml

      - name: Setup Pulumi
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7
        with:
          pulumi-version: ${{ env.PULUMI_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_PROD_SERVICE_ACCOUNT_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: mcp-registry-prod
          install_components: gke-gcloud-auth-plugin

      - name: Verify GKE authentication
        env:
          # setup-gcloud already imports this job's service account. The file
          # override loader crashes in config-helper (missing private_key_id).
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ""
        run: |
          # Discard credential output; fail before building if token acquisition fails.
          gcloud auth print-access-token > /dev/null
          gke-gcloud-auth-plugin > /dev/null

      - name: Deploy to Production
        working-directory: ./deploy
        env:
          PULUMI_PROD_PASSPHRASE: ${{ secrets.PULUMI_PROD_PASSPHRASE }}
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ""
          DEPLOY_OPERATION: ${{ inputs.operation }}
        run: |
          umask 077
          trap 'rm -f passphrase.prod.txt' EXIT
          printf '%s' "$PULUMI_PROD_PASSPHRASE" > passphrase.prod.txt
          export PULUMI_CONFIG_PASSPHRASE_FILE="$PWD/passphrase.prod.txt"
          mode="${DEPLOY_OPERATION:-apply}"
          if [ "$mode" = "apply" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Production apply requires main."
              exit 1
            fi
            make prod-up
          else
            make prod-preview
          fi
