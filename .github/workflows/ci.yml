name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Build, Lint, and Validate
  build-lint-validate:
    name: Build, Lint, and Validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 'stable'
        cache: true

    - name: Run lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
      with:
        version: v2.13.1

    # Node is required by `make validate`: the server.json JSON Schema is
    # generated from docs/reference/server-json/schema.ts and checked for drift.
    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: docs/reference/server-json/package-lock.json

    - name: Validate schemas and examples
      run: make validate

    - name: Build application
      run: make build

    - name: Run govulncheck
      uses: golang/govulncheck-action@v1
      with:
        go-version-input: 'stable'
        go-package: ./...
        repo-checkout: false

  # All Tests
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 'stable'
        cache: true

    - name: Set up ko
      uses: ko-build/setup-ko@v0.10

    - name: Run all tests
      run: make test-all

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: coverage-report
        path: |
          coverage.out
          coverage.html
